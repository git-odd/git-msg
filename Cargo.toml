[package]
name = "git-msg"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
inquire = "0.7"
indicatif = "0.17"
colored = "2.1"
glob = "0.3"
tempfile = "3.10"
dirs = "5.0"
regex = "1.10"
anyhow = "1.0"
